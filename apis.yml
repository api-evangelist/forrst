name: Forrst
description: Forrst was a community for designers and developers to share work in progress
  and give and receive detailed feedback, founded in 2009 by Kyle Bragger with seed
  funding from 500 Startups (500 Global) and other angels. It was acquired by Colourlovers
  in 2012, then by product-design firm ZURB in January 2013, and was shut down on
  April 14, 2014. The company is defunct; forrst.com now redirects to zurb.com and
  there is no active API, developer portal, or public API surface to enrich. This
  profile is retained as a historical 500 Global portfolio lead.
